[project]
name = "brd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
brd = "brd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brd"]
